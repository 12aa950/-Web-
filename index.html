<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园失物招领</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <h1 class="logo">校园失物招领</h1>
  <nav class="nav" id="nav"></nav>
</header>

<main id="view"></main>

<footer class="footer">© 2026 校园失物招领 — 福州大学软件工程作业</footer>

<!-- 发布弹窗 -->
<div class="modal" id="publishModal" hidden>
  <div class="modal-card">
    <h2>发布信息</h2>
    <div class="type-tabs">
      <button class="tab active" data-type="lost">我丢了东西 · 寻物</button>
      <button class="tab" data-type="found">我捡到东西 · 招领</button>
    </div>
    <label>物品名称<input id="i-name" placeholder="如：黑色雨伞"></label>
    <label>物品描述<textarea id="i-desc" placeholder="补充物品特征、丢失 / 拾到经过…"></textarea></label>
    <label>地点<input id="i-place" placeholder="如：一区教学楼"></label>
    <label>联系方式<input id="i-contact" placeholder="微信 / QQ / 手机号"></label>
    <div class="modal-actions">
      <button class="btn-secondary" id="i-cancel">取消</button>
      <button class="btn-primary" id="i-submit">发布</button>
    </div>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="modal" id="detailModal" hidden>
  <div class="modal-card">
    <h2 id="d-title">物品详情</h2>
    <div class="meta">
      <span class="tag" id="d-type">招领</span>
      <span class="time" id="d-time"></span>
    </div>
    <p class="desc" id="d-desc"></p>
    <ul class="info">
      <li><b>地点：</b><span id="d-place"></span></li>
      <li><b>联系方式：</b><span id="d-contact"></span></li>
      <li><b>状态：</b><span id="d-status"></span></li>
    </ul>
    <div class="modal-actions">
      <button class="btn-secondary" id="d-copy">复制联系方式</button>
      <button class="btn-secondary" id="d-close">关闭</button>
      <button class="btn-primary" id="d-status-btn">标记为已完成</button>
    </div>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/data.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js"></script>
</body>
</html>
